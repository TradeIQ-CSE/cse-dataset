name: Daily CSE Dataset Recovery Checks

on:
  schedule:
    # Run at 12:30 UTC (18:00 Sri Lanka time). CSE closes at 14:30 SLST, but
    # dailyMarketSummery does not settle the current trading day immediately:
    # on 2026-09-09 it still served the previous day at 15:55 SLST and had
    # rolled over by 17:10. Collecting at 14:45 quarantines the index run.
    # tradeSummary still reports the same trading day at this hour.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      session: ${{ steps.capture.outputs.session }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Smoke check runtime
        run: uv run python scripts/smoke_check.py

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Daily OHLCV source validation
        run: >-
          uv run python scripts/daily_update.py
          --allow-validation-failure
          --result-manifest data/run/daily_result.json

      - name: Deliver accepted OHLCV to TradeIQ
        if: ${{ vars.TRADEIQ_INGESTION_ENABLED == 'true' }}
        env:
          TRADEIQ_INGESTION_API_URL: ${{ secrets.TRADEIQ_INGESTION_API_URL }}
          TRADEIQ_INGESTION_TOKEN: ${{ secrets.TRADEIQ_INGESTION_TOKEN }}
        run: |
          test -n "$TRADEIQ_INGESTION_API_URL"
          test -n "$TRADEIQ_INGESTION_TOKEN"
          uv run python scripts/publish_eod.py \
            --result-manifest data/run/daily_result.json \
            --calendar-path config/trading_calendar.csv \
            --out-dir data/run/delivery

      - name: 2026-forward source validation summary
        run: uv run python scripts/2026_forward_update.py --allow-validation-failure

      - name: Daily index collection (ASPI, S&P SL20)
        run: uv run python scripts/daily_indices_update.py --allow-validation-failure

      # cdn.cse.lk returns 403 from local and hosted egress alike, which blocks
      # the SMD PDF path and the official workbook downloads. This reports
      # whether GitHub's network is treated differently, without failing the run.
      - name: Probe cdn.cse.lk reachability
        if: always()
        run: |
          date_str=$(TZ=Asia/Colombo date +%d-%m-%Y)
          url="https://cdn.cse.lk/cse-daily/StockMarketDaily%28SMD%29${date_str}.pdf"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$url" || echo "000")
          echo "cdn.cse.lk SMD ${date_str}: HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "REACHABLE from GitHub Actions - the PDF and workbook paths are usable here."
          else
            echo "Not reachable (HTTP ${code}); the 403 is not specific to the local network."
          fi

      - name: Record validation audit log
        if: always()
        run: uv run python scripts/record_ohlcv_run.py

      # One directory, so the artifact always has data/ and docs/ at its root.
      - name: Gather the capture
        id: capture
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/capture"
          for path in \
            docs/daily_ohlcv_runs.jsonl \
            docs/daily_ohlcv_runs.md \
            data/raw/ohlcv/source_payloads \
            data/raw/ohlcv/accepted \
            data/raw/ohlcv/manifests \
            data/raw/2026_forward \
            data/processed/daily_ohlcv \
            data/processed/validation/ohlcv \
            data/processed/validation/2026_forward \
            data/processed/2026_forward \
            data/processed/company_metadata.csv \
            data/run; do
            if [ -e "$path" ]; then cp -R --parents "$path" "$RUNNER_TEMP/capture/"; fi
          done
          # The session the snapshot holds; the run's own date if the fetch failed.
          session=$(jq -r '.target_date // empty' data/run/daily_result.json 2>/dev/null || true)
          echo "session=${session:-$(TZ=Asia/Colombo date +%F)}" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohlcv-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/capture/
          if-no-files-found: ignore

  # Artifacts expire after 90 days, so every run is also kept on the captures
  # branch. This job holds the write token; the job that fetches and parses
  # source data stays read-only.
  save:
    needs: update
    if: always() && needs.update.outputs.session != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the captures branch
        uses: actions/checkout@v4
        with:
          ref: captures

      - name: Download the capture
        uses: actions/download-artifact@v4
        with:
          name: ohlcv-validation-${{ github.run_id }}
          path: ${{ needs.update.outputs.session }}/${{ github.run_id }}

      - name: Commit it to the captures branch
        env:
          SESSION: ${{ needs.update.outputs.session }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- "$SESSION/$GITHUB_RUN_ID"
          git commit -m "Capture $SESSION, run $GITHUB_RUN_ID"
          # Runs can overlap, and a concurrency group would cancel a queued
          # run. Each run writes only its own folder, so a push that loses the
          # race rebases cleanly onto the other run's commit.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:captures && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin captures
          done
          exit 1
