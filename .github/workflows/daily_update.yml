name: Daily CSE Dataset Recovery Checks

on:
  schedule:
    # Run at 20:00 UTC (01:30 Sri Lanka time, after CSE close at 14:30 LKT)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Smoke check runtime
        run: uv run python scripts/smoke_check.py

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Daily OHLCV source validation dry run
        run: uv run python scripts/daily_update.py --dry-run --allow-missing-metadata
