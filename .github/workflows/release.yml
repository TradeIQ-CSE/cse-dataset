name: Dataset release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision for this coverage end date (1 for a first release)"
        required: true
        default: "1"
      publish:
        description: "Publish a GitHub release; otherwise build and validate only"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Collect active company metadata
        run: uv run python scripts/01_collect_metadata.py

      - name: Backfill the official price files
        run: |
          while IFS= read -r source; do
            case "$source" in ''|'#'*) continue ;; esac
            uv run python scripts/backfill_ohlcv.py --source-path "$source" --allow-validation-failure
          done < config/release_sources.txt

      - name: Fill metadata for delisted and rights symbols
        run: uv run python scripts/fill_missing_metadata.py

      # The archive always reports failures: 1,024 frozen zero MPI closes and 4
      # conflicting ASTRI/MTRI duplicates, none inside the release window.
      # build_release.py refuses unless every shipped series has a value on
      # every session, so a real gap still stops the release.
      - name: Convert the index archive
        run: uv run python scripts/convert_historical_indices.py --allow-validation-failure

      - name: Build and validate the artifact
        env:
          REVISION: ${{ inputs.revision }}
        run: uv run python scripts/build_release.py --revision "$REVISION"

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-release-${{ github.run_id }}
          path: data/published/
          if-no-files-found: ignore

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .dataset_version data/published/manifest.json)
          # Fails when the tag exists: a published version is never replaced.
          # --target tags the commit that was built, not whatever main is now.
          gh release create "dataset-$version" \
            --target "$GITHUB_SHA" \
            "data/published/cse-dataset-$version.zip" \
            data/published/manifest.json \
            --title "Dataset $version" \
            --notes-file data/published/release_notes.md

      - name: Validate the published asset
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .dataset_version data/published/manifest.json)
          gh release download "dataset-$version" --pattern "*.zip" --dir downloaded
          uv run python scripts/validate_artifact.py "downloaded/cse-dataset-$version.zip"
